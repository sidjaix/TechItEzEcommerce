name: tie-e-commerce

services:
  user_api:
    container_name: e_commerce_user_api
    image: sidjaix/user-api:latest
    build:
      context: .
      dockerfile: ./UserAccess/Dockerfile
    ports:
      - '5001:80'
    env_file:
      - .env
    restart: always
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${USER_API_CONNECTION_STRING}
    networks:
      - techitez_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3

  product_api:
    container_name: e_commerce_product_api
    image: sidjaix/product-api:latest
    build:
      context: .
      dockerfile: ./Product/Dockerfile
    ports:
      - '5002:80'
    env_file:
      - .env
    restart: always
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${PRODUCT_API_CONNECTION_STRING}
      - RabbitMq__Host=${RabbitMq_Host}
    networks:
      - techitez_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3

  cart_api:
    container_name: e_commerce_cart_api
    image: sidjaix/cart-api:latest
    build:
      context: .
      dockerfile: ./Cart/Dockerfile
    ports:
      - '5003:80'
    env_file:
      - .env
    restart: always
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${CART_API_CONNECTION_STRING}
      - RabbitMq__Host=${RabbitMq_Host}
    networks:
      - techitez_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3

  order_api:
    container_name: e_commerce_order_api
    image: sidjaix/order-api:latest
    build:
      context: .
      dockerfile: ./Order/Dockerfile
    ports:
      - '5004:80'
    env_file:
      - .env
    restart: always
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${ORDER_API_CONNECTION_STRING}
    networks:
      - techitez_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3

  rabbit_mq:
    container_name: techitez_rabbitmqserver
    image: rabbitmq:3-management
    hostname: ecomm-rabbit-mq-server
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    networks:
      - techitez_network

  sqlserver:
    container_name: techitez_sqlserver
    hostname: sqledge
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      SA_PASSWORD: 'Admin@123'
      ACCEPT_EULA: '1'
    ports:
      - '1433:1433'
    volumes:
      - techitez-sqledge:/var/opt/mssql
    networks:
      - techitez_network

  api_gateway:
    container_name: e_commerce_api_gateway
    image: sidjaix/api-gateway:latest
    build:
      context: .
      dockerfile: ./ApiGateway/Dockerfile
    ports:
      - '8080:80' # This is your new master entry point!
    env_file:
      - .env
    restart: always
    depends_on:
      - user_api
      - product_api
      - cart_api
      - order_api
    networks:
      - techitez_network

networks:
  techitez_network:
    driver: bridge

volumes:
  techitez-sqledge:
