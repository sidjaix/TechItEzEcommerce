version: '3.4'

services:
  webapi:
    container_name: techitez_user_api
    image: user-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:80'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DockerDB=Server=sqlserver;Database=TechItEzEcommerce;User Id=SA;Password=admin@123;TrustServerCertificate=true; MultipleActiveResultSets=True;
      - ConnectionStrings__AzureDB=Server=tcp:techitez.database.windows.net,1433;Initial Catalog=TechItEzEcommerce;Persist Security Info=False;User ID=sidjaix;Password=admin@123; MultipleActiveResultSets=True; Encrypt=True; TrustServerCertificate=True; Connection Timeout=60;
    networks:
      - techitez_network

  sqlserver:
    container_name: techitez_sqlserver
    image: mcr.microsoft.com/azure-sql-edge
    environment:
      SA_PASSWORD: 'admin@123'
      ACCEPT_EULA: 'Y'
    ports:
      - '1433:1433'
    networks:
      - techitez_network

networks:
  techitez_network:
    driver: bridge
